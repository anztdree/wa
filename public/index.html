<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BOT_CORE - WhatsApp Auto-Reply</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cyber: #05070a; --bg-card: rgba(10, 15, 24, 0.85); --border-neon: rgba(0, 240, 255, 0.2);
      --neon-cyan: #00f0ff; --neon-cyan-glow: rgba(0, 240, 255, 0.4); --neon-green: #00ff66;
      --neon-magenta: #ff0055; --neon-yellow: #fbbf24; --text-main: #e2e8f0; --text-muted: #64748b;
      --msg-sent: rgba(0, 240, 255, 0.1); --msg-received: rgba(15, 23, 42, 0.9);
      --input-bg: rgba(0, 0, 0, 0.4); --grid-opacity: 0.03;
    }
    html.light {
      --bg-cyber: #f1f5f9; --bg-card: rgba(255, 255, 255, 0.9); --border-neon: rgba(14, 165, 233, 0.3);
      --neon-cyan: #0284c7; --neon-cyan-glow: rgba(14, 165, 233, 0.2); --neon-green: #16a34a;
      --neon-magenta: #dc2626; --neon-yellow: #d97706; --text-main: #1e293b; --text-muted: #94a3b8;
      --msg-sent: rgba(14, 165, 233, 0.08); --msg-received: rgba(241, 245, 249, 0.95);
      --input-bg: rgba(0, 0, 0, 0.04); --grid-opacity: 0.04;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Grotesk', sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; width: 100%; overflow: hidden; background-color: #020305; color: var(--text-main); transition: background-color 0.3s, color 0.3s; }
    html.light, html.light body { background-color: #e2e8f0; }
    .app-container {
      width: 100%; max-width: 480px; height: 100vh; height: 100dvh; margin: 0 auto;
      background-color: var(--bg-cyber);
      background-image: linear-gradient(rgba(0, 240, 255, var(--grid-opacity)) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 240, 255, var(--grid-opacity)) 1px, transparent 1px);
      background-size: 24px 24px;
      display: flex; flex-direction: column; position: relative; overflow: hidden;
      transition: background-color 0.3s;
    }

    /* ===== HEADER ===== */
    .main-header {
      height: 48px; background: var(--bg-card); backdrop-filter: blur(12px);
      padding: 0 12px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border-neon); flex-shrink: 0; z-index: 10;
    }
    .app-logo { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: var(--neon-cyan); letter-spacing: 1px; display: flex; align-items: center; gap: 6px; text-shadow: 0 0 10px var(--neon-cyan-glow); }
    html.light .app-logo { text-shadow: none; }
    .header-right { display: flex; align-items: center; gap: 4px; }
    .status-pill { display: flex; align-items: center; gap: 5px; font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.5px; padding: 3px 8px; border-radius: 4px; background: rgba(0,0,0,0.2); border: 1px solid var(--border-neon); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }
    .dot.online { background: var(--neon-green); box-shadow: 0 0 6px var(--neon-green); }
    .icon-btn { background: none; border: none; color: var(--text-muted); font-size: 14px; cursor: pointer; padding: 6px; border-radius: 6px; transition: all 0.2s; }
    .icon-btn:hover { color: var(--neon-cyan); background: rgba(0, 240, 255, 0.08); }

    /* ===== ENGINE BAR ===== */
    .engine-bar {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      background: var(--bg-card); border-bottom: 1px solid var(--border-neon); flex-shrink: 0;
    }
    .eb-left { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .eb-status { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; color: var(--neon-magenta); letter-spacing: 0.5px; }
    .eb-status.active { color: var(--neon-green); }
    .eb-divider { width: 1px; height: 20px; background: var(--border-neon); flex-shrink: 0; }
    .eb-center { display: flex; gap: 4px; flex-shrink: 0; }
    .mode-btn {
      font-family: 'JetBrains Mono', monospace; font-size: 8px; padding: 3px 8px;
      border: 1px solid var(--border-neon); background: transparent; color: var(--text-muted);
      border-radius: 4px; cursor: pointer; transition: all 0.2s; letter-spacing: 0.5px;
    }
    .mode-btn:hover { border-color: var(--neon-cyan); color: var(--neon-cyan); }
    .mode-btn.active-draft { background: rgba(251, 191, 36, 0.15); border-color: var(--neon-yellow); color: var(--neon-yellow); }
    .mode-btn.active-auto { background: rgba(0, 255, 102, 0.15); border-color: var(--neon-green); color: var(--neon-green); }
    .eb-right { display: flex; gap: 8px; margin-left: auto; }
    .eb-stat { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-muted); }
    .eb-stat b { color: var(--neon-cyan); font-weight: 600; }
    .eb-stat.green b { color: var(--neon-green); }
    .eb-stat.red b { color: var(--neon-magenta); }
    .eb-stat.yellow b { color: var(--neon-yellow); }

    /* ===== SWITCH ===== */
    .switch { position: relative; width: 34px; height: 18px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: var(--text-muted); border-radius: 18px; cursor: pointer; transition: 0.3s; }
    .slider:before { content: ''; position: absolute; height: 14px; width: 14px; left: 2px; bottom: 2px; background: white; border-radius: 50%; transition: 0.3s; }
    .switch input:checked + .slider { background: var(--neon-green); }
    .switch input:checked + .slider:before { transform: translateX(16px); }

    /* ===== TABS ===== */
    .tab-bar { display: flex; background: var(--bg-card); border-bottom: 1px solid var(--border-neon); flex-shrink: 0; }
    .tab-btn { flex: 1; padding: 10px; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 1px; color: var(--text-muted); background: none; border: none; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .tab-btn.active { color: var(--neon-cyan); border-bottom-color: var(--neon-cyan); }
    .tab-btn:hover { color: var(--neon-cyan); }
    .tab-btn .badge { background: var(--neon-magenta); color: white; font-size: 8px; padding: 1px 5px; border-radius: 8px; font-weight: 700; }

    /* ===== CONTENT ===== */
    .content-area { flex: 1; overflow: hidden; position: relative; }
    .tab-content { display: none; height: 100%; overflow: hidden; flex-direction: column; }
    .tab-content.active { display: flex; }

    /* ===== SEARCH ===== */
    .search-bar { padding: 8px; flex-shrink: 0; }
    .input-box {
      display: flex; align-items: center; gap: 8px; background: var(--input-bg);
      border: 1px solid var(--border-neon); border-radius: 8px; padding: 8px 12px; color: var(--text-main); font-size: 13px; font-family: 'Space Grotesk', sans-serif;
    }
    .input-box input { background: none; border: none; outline: none; color: var(--text-main); font-size: 13px; font-family: inherit; flex: 1; }
    .input-box input::placeholder { color: var(--text-muted); }

    /* ===== CHAT LIST ===== */
    .chat-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
    .chat-card {
      display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px;
      cursor: pointer; transition: background 0.2s; margin-bottom: 2px;
    }
    .chat-card:hover { background: rgba(0, 240, 255, 0.05); }
    .avatar-box {
      width: 42px; height: 42px; border-radius: 50%; background: var(--input-bg); border: 1px solid var(--border-neon);
      display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 16px;
      overflow: hidden; flex-shrink: 0; position: relative;
    }
    .avatar-box img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; opacity: 0; transition: opacity 0.3s; }
    .avatar-box img.loaded { opacity: 1; }
    .chat-info { flex: 1; min-width: 0; }
    .chat-header-line { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
    .contact-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .timestamp { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-muted); flex-shrink: 0; }
    .preview-msg { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
    .tick { font-size: 10px; }
    .tick-blue { color: var(--neon-cyan); }
    .tick-grey { color: var(--text-muted); }
    .feed-empty { text-align: center; padding: 40px 20px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1px; }

    /* ===== ROOM OVERLAY ===== */
    .room-overlay {
      position: absolute; inset: 0; background: var(--bg-cyber); z-index: 20;
      display: none; flex-direction: column; transform: translateX(100%); transition: transform 0.25s ease;
    }
    .room-overlay.active { display: flex; transform: translateX(0); }
    .room-header {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg-card);
      border-bottom: 1px solid var(--border-neon); flex-shrink: 0; height: 52px;
    }
    .chat-viewport { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
    .msg-bubble {
      max-width: 82%; padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.5; word-wrap: break-word;
    }
    .msg-bubble.received { background: var(--msg-received); align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg-bubble.sent { background: var(--msg-sent); align-self: flex-end; border-bottom-right-radius: 4px; border: 1px solid var(--border-neon); }
    .msg-bubble.draft-bubble { border-left: 3px solid var(--neon-yellow) !important; opacity: 0.8; }
    .msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 3px; font-family: 'JetBrains Mono', monospace; font-size: 8px; color: var(--text-muted); }
    .room-footer { display: flex; gap: 8px; padding: 8px; background: var(--bg-card); border-top: 1px solid var(--border-neon); flex-shrink: 0; }
    .text-input-field { flex: 1; }
    .text-input-field input {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border-neon); border-radius: 8px;
      padding: 10px 12px; color: var(--text-main); font-size: 13px; font-family: inherit; outline: none;
    }
    .text-input-field input::placeholder { color: var(--text-muted); }
    .send-trigger {
      width: 42px; height: 42px; border-radius: 50%; background: var(--neon-cyan); border: none;
      color: #05070a; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0;
    }
    .send-trigger:hover { box-shadow: 0 0 16px var(--neon-cyan-glow); }

    /* ===== ACTIVITY FEED ===== */
    .feed-list { flex: 1; overflow-y: auto; padding: 8px; }
    .feed-item {
      display: flex; gap: 8px; padding: 8px; border-radius: 6px; margin-bottom: 4px;
      background: var(--input-bg); border: 1px solid var(--border-neon);
    }
    .feed-icon {
      width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
      font-size: 10px; flex-shrink: 0; background: rgba(0, 255, 102, 0.15); color: var(--neon-green);
    }
    .feed-icon.fail { background: rgba(255, 0, 85, 0.15); color: var(--neon-magenta); }
    .feed-icon.draft { background: rgba(251, 191, 36, 0.15); color: var(--neon-yellow); }
    .feed-body { flex: 1; min-width: 0; }
    .feed-name { font-size: 11px; font-weight: 600; margin-bottom: 2px; }
    .feed-query { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .feed-reply { font-size: 11px; color: var(--neon-green); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fail-text { color: var(--neon-magenta); }
    .feed-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; }
    .feed-time { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: var(--text-muted); }
    .feed-latency { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: var(--neon-cyan); }

    /* ===== AI SETTINGS MODAL ===== */
    .modal-overlay {
      position: absolute; inset: 0; background: rgba(5, 7, 10, 0.92); backdrop-filter: blur(8px);
      z-index: 50; display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      width: 100%; max-height: 85vh; overflow-y: auto; background: var(--bg-card); border: 1px solid var(--border-neon);
      border-radius: 12px; padding: 20px;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-title { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: var(--neon-cyan); letter-spacing: 1px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .form-group input, .form-group textarea {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border-neon); border-radius: 6px;
      padding: 8px 10px; color: var(--text-main); font-size: 12px; font-family: 'JetBrains Mono', monospace; outline: none; resize: vertical;
    }
    .form-group input::placeholder, .form-group textarea::placeholder { color: var(--text-muted); opacity: 0.6; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--neon-cyan); }
    .btn-save {
      width: 100%; padding: 10px; background: var(--neon-cyan); color: #05070a; border: none; border-radius: 6px;
      font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; cursor: pointer; transition: all 0.2s; margin-top: 8px;
    }
    .btn-save:hover { box-shadow: 0 0 20px var(--neon-cyan-glow); }
    .modal-feedback { display: none; padding: 8px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 10px; text-align: center; margin-top: 8px; }
    .modal-feedback.ok { display: block; background: rgba(0,255,102,0.1); color: var(--neon-green); border: 1px solid var(--neon-green); }
    .modal-feedback.err { display: block; background: rgba(255,0,85,0.1); color: var(--neon-magenta); border: 1px solid var(--neon-magenta); }
  </style>
</head>
<body>
<div class="app-container">

  <!-- HEADER -->
  <div class="main-header">
    <div class="app-logo"><i class="fa-solid fa-robot"></i> BOT_CORE</div>
    <div class="header-right">
      <div class="status-pill"><span id="statusDot" class="dot"></span><span id="statusText">OFFLINE</span></div>
      <button class="icon-btn" onclick="openAISettings()" title="AI Settings"><i class="fa-solid fa-sliders"></i></button>
      <button class="icon-btn" onclick="toggleTheme()"><i id="themeIcon" class="fa-solid fa-sun"></i></button>
    </div>
  </div>

  <!-- ENGINE BAR -->
  <div class="engine-bar">
    <div class="eb-left">
      <label class="switch"><input type="checkbox" id="autoReplyToggle" onchange="toggleAutoReply()"><span class="slider"></span></label>
      <span id="engineStatusText" class="eb-status">DISABLED</span>
    </div>
    <div class="eb-divider"></div>
    <div class="eb-center">
      <button class="mode-btn active-draft" id="btnDraft" onclick="switchSendMode('draft')">DRAFT</button>
      <button class="mode-btn" id="btnAuto" onclick="switchSendMode('auto')">AUTO</button>
    </div>
    <div class="eb-right">
      <span class="eb-stat green"><b id="statReplied">0</b> sent</span>
      <span class="eb-stat red"><b id="statFailed">0</b> fail</span>
      <span class="eb-stat yellow"><b id="statLatency">0</b>ms</span>
    </div>
  </div>

  <!-- TABS -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('chatTab', this)"><i class="fa-solid fa-comments"></i> PESAN</button>
    <button class="tab-btn" onclick="switchTab('logTab', this)"><i class="fa-solid fa-signal"></i> LOG</button>
  </div>

  <!-- CONTENT -->
  <div class="content-area">

    <!-- CHAT TAB -->
    <div id="chatTab" class="tab-content active">
      <div class="search-bar">
        <div class="input-box">
          <i class="fa-solid fa-magnifying-glass" style="color: var(--neon-cyan); font-size: 12px;"></i>
          <input type="text" id="newPhoneInput" placeholder="Ketik nomor baru (+62...)" onkeypress="handleNewChat(event)">
        </div>
      </div>
      <div id="chatList" class="chat-list">
        <div class="feed-empty"><i class="fa-solid fa-comments"></i>&nbsp; NO_ACTIVE_CHATS</div>
      </div>
      <!-- ROOM OVERLAY -->
      <div id="roomOverlay" class="room-overlay">
        <div class="room-header">
          <button class="icon-btn" onclick="closeRoomOverlay()"><i class="fa-solid fa-chevron-left"></i></button>
          <div id="roomAvatar" class="avatar-box" style="width: 32px; height: 32px; font-size: 12px;"><i class="fa-solid fa-user"></i></div>
          <div style="flex: 1; overflow: hidden;">
            <div id="roomTitle" class="contact-title" style="font-size: 13px;">Target</div>
            <div style="font-family: 'JetBrains Mono', monospace; font-size: 8px; color: var(--neon-green);">ONLINE</div>
          </div>
        </div>
        <div id="chatViewport" class="chat-viewport"></div>
        <div class="room-footer">
          <div class="text-input-field">
            <input type="text" id="msgInput" placeholder="Ketik pesan..." onkeypress="handleKeyPress(event)" autocomplete="off">
          </div>
          <button class="send-trigger" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>
    </div>

    <!-- LOG TAB -->
    <div id="logTab" class="tab-content">
      <div id="activityFeed" class="feed-list">
        <div class="feed-empty"><i class="fa-solid fa-satellite-dish"></i>&nbsp; MENUNGGU AKTIVITAS...</div>
      </div>
    </div>
  </div>

  <!-- AI SETTINGS MODAL -->
  <div id="aiModal" class="modal-overlay" onclick="if(event.target===this)closeAISettings()">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title"><i class="fa-solid fa-sliders"></i> AI CONFIG</span>
        <button class="icon-btn" onclick="closeAISettings()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="form-group">
        <label>API_KEY</label>
        <input type="password" id="apiKeyInput" placeholder="nvapi-... atau sk-...">
      </div>
      <div class="form-group">
        <label>BASE_URL</label>
        <input type="text" id="apiBaseUrlInput" placeholder="https://integrate.api.nvidia.com/v1/chat/completions">
      </div>
      <div class="form-group">
        <label>MODEL</label>
        <input type="text" id="modelInput" placeholder="nvidia/nemotron-3-ultra-550b-a55b">
      </div>
      <div class="form-group">
        <label>SYSTEM_PROMPT</label>
        <textarea id="systemPromptInput" rows="4" placeholder="Definisikan perilaku AI..."></textarea>
      </div>
      <div class="form-group">
        <label>TRIGGER_PREFIX <span style="color:var(--text-muted);font-weight:400;text-transform:none;letter-spacing:0">(kosongkan = balas semua)</span></label>
        <input type="text" id="aiTriggerInput" placeholder="Contoh: ! atau .bot">
      </div>
      <div id="saveAiFeedback" class="modal-feedback"></div>
      <button class="btn-save" onclick="saveAiSettings()">SIMPAN KONFIGURASI</button>
    </div>
  </div>

</div>

<script>
  const socket = io();
  let chats = {};
  let activeJid = null;
  let autoReplyEnabled = false;
  let currentSendMode = 'draft';
  let ppCache = {};
  let sessionUptimeStart = Date.now();
  let activityLogs = [];
  const MAX_FEED = 50;

  // ==================== THEME ====================
  function toggleTheme() {
    document.documentElement.classList.toggle('light');
    const isLight = document.documentElement.classList.contains('light');
    document.getElementById('themeIcon').className = isLight ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
  }
  if (localStorage.getItem('theme') === 'light') {
    document.documentElement.classList.add('light');
    document.getElementById('themeIcon').className = 'fa-solid fa-moon';
  }

  // ==================== TABS ====================
  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
  }

  // ==================== ENGINE CONTROLS ====================
  function toggleAutoReply() {
    const cb = document.getElementById('autoReplyToggle');
    autoReplyEnabled = cb.checked;
    const el = document.getElementById('engineStatusText');
    el.innerText = autoReplyEnabled ? 'ACTIVE' : 'DISABLED';
    el.className = 'eb-status' + (autoReplyEnabled ? ' active' : '');
    socket.emit('toggle_autoreply', { enabled: autoReplyEnabled });
  }

  function switchSendMode(mode) {
    currentSendMode = mode;
    document.getElementById('btnDraft').className = 'mode-btn' + (mode === 'draft' ? ' active-draft' : '');
    document.getElementById('btnAuto').className = 'mode-btn' + (mode === 'auto' ? ' active-auto' : '');
    socket.emit('set_send_mode', { mode });
  }

  // ==================== AI MODAL ====================
  function openAISettings() { document.getElementById('aiModal').classList.add('active'); }
  function closeAISettings() { document.getElementById('aiModal').classList.remove('active'); }

  // ==================== SOCKET EVENTS ====================
  socket.on('status', (status) => {
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');
    if (status === 'open') { dot.className = 'dot online'; txt.style.color = 'var(--neon-green)'; txt.textContent = 'LIVE'; sessionUptimeStart = Date.now(); }
    else if (status === 'connecting') { dot.className = 'dot'; txt.style.color = 'var(--neon-yellow)'; txt.textContent = 'CONNECTING'; }
    else { dot.className = 'dot'; txt.style.color = 'var(--text-muted)'; txt.textContent = 'OFFLINE'; }
  });

  socket.on('load_history', (messages) => { messages.forEach(msg => appendMessageToLocal(msg)); renderChatList(); });

  socket.on('new_message', (msg) => { appendMessageToLocal(msg); renderChatList(); if (activeJid === msg.from) renderMessages(activeJid); });

  socket.on('pp_cache', (data) => { if (!data) return; ppCache = { ...ppCache, ...data }; renderChatList(); if (activeJid) setRoomPP(activeJid); });

  socket.on('profile_picture', (data) => { if (data?.jid?.url) { ppCache[data.jid] = data.url; renderChatList(); if (activeJid === data.jid) setRoomPP(data.jid); } });

  socket.on('ai_config', (cfg) => {
    if (!cfg) return;
    document.getElementById('apiKeyInput').value = cfg.apiKey === '***' ? '' : (cfg.apiKey || '');
    document.getElementById('apiBaseUrlInput').value = cfg.apiBaseUrl || '';
    document.getElementById('modelInput').value = cfg.model || '';
    document.getElementById('systemPromptInput').value = cfg.systemPrompt || '';
    document.getElementById('aiTriggerInput').value = cfg.triggerPrefix || '';
    const cb = document.getElementById('autoReplyToggle');
    cb.checked = cfg.enabled;
    autoReplyEnabled = cfg.enabled;
    const el = document.getElementById('engineStatusText');
    el.innerText = cfg.enabled ? 'ACTIVE' : 'DISABLED';
    el.className = 'eb-status' + (cfg.enabled ? ' active' : '');
    const mode = cfg.sendMode || 'draft';
    currentSendMode = mode;
    document.getElementById('btnDraft').className = 'mode-btn' + (mode === 'draft' ? ' active-draft' : '');
    document.getElementById('btnAuto').className = 'mode-btn' + (mode === 'auto' ? ' active-auto' : '');
  });

  socket.on('session_stats', (s) => {
    if (!s) return;
    document.getElementById('statReplied').textContent = s.replied || 0;
    document.getElementById('statFailed').textContent = s.failed || 0;
    document.getElementById('statLatency').textContent = s.avgLatency || 0;
    if (s.startTime) sessionUptimeStart = s.startTime;
  });

  socket.on('auto_reply_log', (entry) => {
    if (!entry) return;
    activityLogs.unshift(entry);
    if (activityLogs.length > MAX_FEED) activityLogs.pop();
    renderActivityFeed();
  });

  socket.on('name_cache', (data) => {
    if (!data) return;
    for (const [jid, name] of Object.entries(data)) {
      if (chats[jid] && name?.trim() && !/^\d+$/.test(name.trim())) {
        if (isRawName(chats[jid].name)) chats[jid].name = name.trim();
      }
    }
    renderChatList();
    if (activeJid && data[activeJid] && !isRawName(data[activeJid])) document.getElementById('roomTitle').innerText = data[activeJid];
  });

  // ==================== AVATAR ====================
  function setRoomPP(jid) {
    const box = document.getElementById('roomAvatar');
    const url = ppCache[jid];
    if (!url || !box) return;
    let img = box.querySelector('img');
    if (!img) { img = document.createElement('img'); box.prepend(img); }
    img.onload = () => img.classList.add('loaded');
    img.onerror = () => img.remove();
    img.src = url;
  }

  // ==================== NAME HELPERS ====================
  function isRawName(name) { if (!name?.trim()) return true; const n = name.trim(); return /^\+?\d+$/.test(n) || n.includes('@'); }
  function stripJid(jid) { return jid.replace(/@s\.whatsapp\.net|@lid|@g\.us/g, ''); }

  // ==================== CHAT DATA ====================
  function appendMessageToLocal(msg) {
    const jid = msg.from; if (!jid) return;
    if (!chats[jid]) {
      const fb = msg.pushName && !isRawName(msg.pushName) ? msg.pushName : stripJid(jid);
      chats[jid] = { name: fb, isGroup: jid.endsWith('@g.us'), messages: [] };
    } else if (msg.pushName?.trim() && !isRawName(msg.pushName)) {
      if (isRawName(chats[jid].name)) chats[jid].name = msg.pushName.trim();
    }
    chats[jid].messages.push(msg);
    chats[jid].messages.sort((a, b) => Number(a.timestamp) - Number(b.timestamp));
  }

  function getTickIcon(s) {
    if (s === 3 || s === 'read') return '<i class="fa-solid fa-check-double tick tick-blue"></i>';
    if (s === 2 || s === 'delivered') return '<i class="fa-solid fa-check-double tick tick-grey"></i>';
    return '<i class="fa-solid fa-check tick tick-grey"></i>';
  }

  function renderChatList() {
    const el = document.getElementById('chatList');
    const sorted = Object.keys(chats).sort((a, b) => {
      const la = chats[a].messages[chats[a].messages.length - 1]?.timestamp || 0;
      const lb = chats[b].messages[chats[b].messages.length - 1]?.timestamp || 0;
      return Number(lb) - Number(la);
    });
    if (sorted.length === 0) return;
    el.innerHTML = '';
    sorted.forEach(jid => {
      const chat = chats[jid]; const last = chat.messages[chat.messages.length - 1];
      const tick = last?.isMe ? getTickIcon(last.status || 3) : '';
      const item = document.createElement('div'); item.className = 'chat-card'; item.onclick = () => openRoomOverlay(jid);
      const ppHtml = ppCache[jid] ? `<img src="${ppCache[jid]}" onload="this.classList.add('loaded')" onerror="this.remove()">` : '';
      item.innerHTML = `<div class="avatar-box"><i class="fa-solid ${chat.isGroup ? 'fa-users' : 'fa-user'}"></i>${ppHtml}</div>
        <div class="chat-info"><div class="chat-header-line"><span class="contact-title">${chat.name}</span><span class="timestamp">${last ? new Date(Number(last.timestamp)).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : ''}</span></div><div class="preview-msg">${tick} <span>${last ? last.text : ''}</span></div></div>`;
      el.appendChild(item);
    });
  }

  function openRoomOverlay(jid) {
    activeJid = jid;
    document.getElementById('roomTitle').innerText = chats[jid]?.name || jid;
    setRoomPP(jid); renderMessages(jid);
    const overlay = document.getElementById('roomOverlay'); overlay.style.display = 'flex'; requestAnimationFrame(() => overlay.classList.add('active'));
  }
  function closeRoomOverlay() {
    activeJid = null;
    const overlay = document.getElementById('roomOverlay'); overlay.classList.remove('active'); setTimeout(() => overlay.style.display = 'none', 250);
  }

  function renderMessages(jid) {
    const vp = document.getElementById('chatViewport'); vp.innerHTML = '';
    (chats[jid]?.messages || []).forEach(msg => {
      const bubble = document.createElement('div');
      bubble.className = `msg-bubble ${msg.isMe ? 'sent' : 'received'}${msg.isDraft ? ' draft-bubble' : ''}`;
      const t = new Date(Number(msg.timestamp || Date.now())).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
      const tick = msg.isMe ? getTickIcon(msg.status || 3) : '';
      const draftTag = msg.isDraft ? '<span style="color:var(--neon-yellow);font-size:8px;font-family:JetBrains Mono,monospace;margin-left:4px;">DRAFT</span>' : '';
      bubble.innerHTML = `${msg.text}${draftTag}<div class="msg-meta"><span>${t}</span>${tick}</div>`;
      vp.appendChild(bubble);
    });
    vp.scrollTop = vp.scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById('msgInput'); const text = input.value.trim();
    if (!text || !activeJid) return;
    socket.emit('send_message', { to: activeJid, message: text }, (res) => { if (res?.success) input.value = ''; });
  }
  function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
  function handleNewChat(e) {
    if (e.key === 'Enter') {
      let phone = e.target.value.replace(/[^0-9]/g, ''); if (!phone) return;
      const jid = `${phone}@s.whatsapp.net`;
      if (!chats[jid]) chats[jid] = { name: `+${phone}`, isGroup: false, messages: [] };
      e.target.value = ''; openRoomOverlay(jid);
    }
  }

  // ==================== ACTIVITY FEED ====================
  function renderActivityFeed() {
    const el = document.getElementById('activityFeed');
    if (activityLogs.length === 0) { el.innerHTML = '<div class="feed-empty"><i class="fa-solid fa-satellite-dish"></i>&nbsp; MENUNGGU AKTIVITAS...</div>'; return; }
    el.innerHTML = activityLogs.map(e => {
      const t = new Date(e.ts || Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      let iconClass, iconFA;
      if (e.type === 'draft') { iconClass = 'draft'; iconFA = 'fa-pen'; }
      else if (e.type === 'success') { iconClass = ''; iconFA = 'fa-check'; }
      else { iconClass = 'fail'; iconFA = 'fa-xmark'; }
      let replyHtml;
      if (e.type === 'draft') replyHtml = `<div class="feed-reply" style="border-left:2px solid var(--neon-yellow);padding-left:6px;">${escHtml(e.reply||'')}</div><div style="font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--neon-yellow);margin-top:2px;">DRAFT</div>`;
      else if (e.type === 'success') replyHtml = `<div class="feed-reply">${escHtml(e.reply||'')}</div>`;
      else replyHtml = `<div class="feed-reply fail-text">${escHtml(e.error||'Unknown')}</div>`;
      const latHtml = e.latency ? `<div class="feed-latency">${e.latency}ms</div>` : '';
      return `<div class="feed-item"><div class="feed-icon ${iconClass}"><i class="fa-solid ${iconFA}"></i></div><div class="feed-body"><div class="feed-name">${escHtml(e.name||'?')}</div><div class="feed-query">${escHtml(e.query||'')}</div>${replyHtml}</div><div class="feed-meta"><div class="feed-time">${t}</div>${latHtml}</div></div>`;
    }).join('');
  }

  function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function saveAiSettings() {
    socket.emit('save_ai_config', {
      apiKey: document.getElementById('apiKeyInput').value,
      apiBaseUrl: document.getElementById('apiBaseUrlInput').value,
      model: document.getElementById('modelInput').value,
      systemPrompt: document.getElementById('systemPromptInput').value,
      triggerPrefix: document.getElementById('aiTriggerInput').value,
    }, (res) => {
      const fb = document.getElementById('saveAiFeedback');
      if (res?.success) { fb.className = 'modal-feedback ok'; fb.innerText = 'Tersimpan!'; }
      else { fb.className = 'modal-feedback err'; fb.innerText = 'Gagal!'; }
      setTimeout(() => { fb.className = 'modal-feedback'; }, 3000);
    });
  }
</script>
</body>
</html>
