<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Command Center - WhatsApp Bot</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cyber: #05070a;
      --bg-card: rgba(10, 15, 24, 0.85);
      --border-neon: rgba(0, 240, 255, 0.2);
      --neon-cyan: #00f0ff;
      --neon-cyan-glow: rgba(0, 240, 255, 0.4);
      --neon-green: #00ff66;
      --neon-magenta: #ff0055;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
      --msg-sent: rgba(0, 240, 255, 0.1);
      --msg-received: rgba(15, 23, 42, 0.9);
      --tick-blue: #00f0ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Grotesk', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    html, body { height: 100%; width: 100%; overflow: hidden; background-color: #020305; color: var(--text-main); }

    /* BACKGROUND GRID PATTERN FUTURISTIK */
    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      background-color: var(--bg-cyber);
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 24px 24px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.1);
      border-left: 1px solid var(--border-neon);
      border-right: 1px solid var(--border-neon);
    }

    /* HEADER COMMAND CENTER */
    .main-header {
      height: 60px;
      background: rgba(5, 7, 10, 0.9);
      backdrop-filter: blur(12px);
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-neon);
      flex-shrink: 0;
      z-index: 10;
    }
    
    .app-logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 700;
      color: var(--neon-cyan);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--neon-cyan-glow);
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      padding: 5px 10px;
      border-radius: 4px;
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid var(--border-neon);
      font-weight: 600;
      text-transform: uppercase;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--neon-magenta);
      box-shadow: 0 0 8px var(--neon-magenta);
    }
    .dot.online {
      background-color: var(--neon-green);
      box-shadow: 0 0 8px var(--neon-green);
    }

    /* NAVIGASI CYBER */
    .nav-tabs {
      display: flex;
      height: 46px;
      background-color: rgba(10, 15, 24, 0.9);
      border-bottom: 1px solid var(--border-neon);
      flex-shrink: 0;
      z-index: 10;
    }
    .tab-btn {
      flex: 1;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .tab-btn.active {
      color: var(--neon-cyan);
      border-bottom-color: var(--neon-cyan);
      background: rgba(0, 240, 255, 0.05);
      text-shadow: 0 0 8px var(--neon-cyan-glow);
    }

    /* KONTEN UTAMA */
    .content-area { flex: 1; min-height: 0; position: relative; overflow: hidden; }
    .tab-content {
      display: none;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
      overflow-y: auto;
    }
    .tab-content.active { display: flex; flex-direction: column; }

    /* DASHBOARD CARD NEON */
    .dashboard-panel { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-neon);
      border-radius: 8px;
      padding: 18px;
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: -1px; left: -1px; width: 10px; height: 10px;
      border-top: 2px solid var(--neon-cyan);
      border-left: 2px solid var(--neon-cyan);
    }
    
    .stat-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 30px;
      font-weight: 700;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px var(--neon-cyan-glow);
    }

    .toggle-row { display: flex; justify-content: space-between; align-items: center; }
    
    /* SWITCH TOGGLE FUTURISTIK */
    .switch { position: relative; display: inline-block; width: 46px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255,255,255,0.05); transition: .3s; border-radius: 4px;
      border: 1px solid var(--border-neon);
    }
    .slider:before {
      position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
      background-color: var(--text-muted); transition: .3s; border-radius: 2px;
    }
    input:checked + .slider { background-color: rgba(0, 240, 255, 0.1); border-color: var(--neon-cyan); }
    input:checked + .slider:before { transform: translateX(24px); background-color: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan); }

    /* CHAT SEARCH & LIST */
    .search-bar { padding: 12px 16px; border-bottom: 1px solid var(--border-neon); display: flex; gap: 10px; background-color: var(--bg-card); }
    .input-box {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-neon);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .input-box input {
      font-family: 'JetBrains Mono', monospace;
      background: transparent; border: none; outline: none; color: var(--text-main); width: 100%; font-size: 12px;
    }

    .chat-list { flex: 1; min-height: 0; overflow-y: auto; }
    .chat-card {
      display: flex;
      align-items: center;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(0, 240, 255, 0.05);
      cursor: pointer;
      transition: background 0.2s;
    }
    .chat-card:hover, .chat-card:active { background-color: rgba(0, 240, 255, 0.05); }
    
    .avatar-box {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid var(--border-neon);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--neon-cyan);
      margin-right: 14px;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
    }
    .avatar-box img {
      width: 100%; height: 100%; object-fit: cover;
      border-radius: 7px;
      display: none;
    }
    .avatar-box img.loaded { display: block; }
    .avatar-box img.loaded + i { display: none; }
    
    .chat-info { flex: 1; min-width: 0; }
    .chat-header-line { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
    .contact-title { font-size: 14px; font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .timestamp { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); }
    .preview-msg { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }

    /* OVERLAY CHAT ROOM */
    .room-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: var(--bg-cyber);
      z-index: 30;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .room-overlay.active { transform: translateX(0); }

    .room-header {
      height: 56px;
      background: rgba(10, 15, 24, 0.95);
      backdrop-filter: blur(12px);
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border-neon);
      z-index: 5;
    }

    .chat-viewport {
      flex: 1;
      min-height: 0;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-bubble {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      line-height: 19px;
      word-wrap: break-word;
      position: relative;
    }

    .msg-bubble.received {
      background-color: var(--msg-received);
      align-self: flex-start;
      border: 1px solid var(--border-neon);
      border-top-left-radius: 0;
      color: var(--text-main);
    }
    .msg-bubble.sent {
      background-color: var(--msg-sent);
      align-self: flex-end;
      border: 1px solid var(--neon-cyan);
      border-top-right-radius: 0;
      color: var(--text-main);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
    }

    .msg-meta {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      float: right;
      margin-left: 10px;
      margin-top: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      color: var(--text-muted);
    }

    .tick { font-size: 11px; }
    .tick-blue { color: var(--tick-blue); text-shadow: 0 0 5px var(--tick-blue); }
    .tick-grey { color: var(--text-muted); }

    .room-footer {
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background-color: rgba(10, 15, 24, 0.95);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      border-top: 1px solid var(--border-neon);
    }
    .text-input-field {
      flex: 1;
      background-color: rgba(0, 0, 0, 0.4);
      border-radius: 6px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      border: 1px solid var(--border-neon);
    }
    .text-input-field input {
      width: 100%;
      background: transparent;
      border: none;
      padding: 10px 0;
      color: var(--text-main);
      outline: none;
      font-size: 13px;
    }
    .send-trigger {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--neon-cyan);
      width: 40px;
      height: 40px;
      border-radius: 6px;
      color: var(--neon-cyan);
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.2s;
      box-shadow: 0 0 10px var(--neon-cyan-glow);
    }
    .send-trigger:active { transform: scale(0.92); }

    /* CONFIG AI PANEL */
    .ai-panel { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .form-group input, .form-group textarea {
      font-family: 'JetBrains Mono', monospace;
      background-color: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-neon);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 12px;
      outline: none;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan-glow); }
    .btn-save {
      font-family: 'JetBrains Mono', monospace;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      font-weight: 700;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 0 10px var(--neon-cyan-glow);
    }
    .btn-save:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- HEADER -->
    <div class="main-header">
      <div class="app-logo"><i class="fa-solid fa-terminal"></i> BOT_CORE v2.0</div>
      <div class="status-pill">
        <span id="statusDot" class="dot"></span>
        <span id="statusText" style="color: var(--text-muted);">OFFLINE</span>
      </div>
    </div>

    <!-- TABS NAVIGATION -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('dashboardTab', this)">
        <i class="fa-solid fa-microchip"></i> SYSTEM
      </button>
      <button class="tab-btn" onclick="switchTab('chatTab', this)">
        <i class="fa-solid fa-code-merge"></i> MESSAGES
      </button>
      <button class="tab-btn" onclick="switchTab('aiTab', this)">
        <i class="fa-solid fa-brain"></i> AI CONFIG
      </button>
    </div>

    <!-- CONTENT AREA -->
    <div class="content-area">

      <!-- TAB 1: DASHBOARD -->
      <div id="dashboardTab" class="tab-content active">
        <div class="dashboard-panel">
          <div class="stat-card">
            <div class="stat-title">AUTO_RESPONSE_ENGINE</div>
            <div class="toggle-row">
              <span id="autoReplyStatusText" style="font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; color: var(--neon-cyan);">ACTIVE</span>
              <label class="switch">
                <input type="checkbox" id="autoReplyToggle" checked onclick="toggleAutoReply()">
                <span class="slider"></span>
              </label>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-title">INCOMING_PACKETS</div>
            <div class="stat-value" id="statIncoming">0</div>
          </div>

          <div class="stat-card">
            <div class="stat-title">OUTGOING_RESPONSES</div>
            <div class="stat-value" id="statReplied">0</div>
          </div>
        </div>
      </div>

      <!-- TAB 2: CHAT -->
      <div id="chatTab" class="tab-content">
        <div class="search-bar">
          <div class="input-box">
            <i class="fa-solid fa-terminal" style="color: var(--neon-cyan);"></i>
            <input type="text" id="newPhoneInput" placeholder="New target JID (+62...)" onkeypress="handleNewChat(event)">
          </div>
        </div>

        <div id="chatList" class="chat-list">
          <div style="padding: 40px 20px; text-align: center; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-size: 11px;">
            NO_ACTIVE_LOGS
          </div>
        </div>

        <!-- CHAT ROOM OVERLAY -->
        <div id="roomOverlay" class="room-overlay">
          <div class="room-header">
            <button style="background:none; border:none; color:var(--neon-cyan); font-size:14px; cursor:pointer;" onclick="closeRoomOverlay()">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <div id="roomAvatar" class="avatar-box" style="width: 36px; height: 36px; font-size: 13px; margin-right: 0;"><i class="fa-solid fa-user"></i></div>
            <div style="flex: 1; overflow: hidden;">
              <div id="roomTitle" class="contact-title">Target ID</div>
              <div style="font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--neon-green);">CONNECTED</div>
            </div>
          </div>
          
          <div id="chatViewport" class="chat-viewport"></div>
          
          <div class="room-footer">
            <div class="text-input-field">
              <input type="text" id="msgInput" placeholder="Execute message..." onkeypress="handleKeyPress(event)" autocomplete="off">
            </div>
            <button class="send-trigger" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
          </div>
        </div>
      </div>

      <!-- TAB 3: AI CONFIG -->
      <div id="aiTab" class="tab-content">
        <div class="ai-panel">
          <div class="form-group">
            <label>API_KEY_AUTH</label>
            <input type="password" id="apiKeyInput" placeholder="Enter key token...">
          </div>

          <div class="form-group">
            <label>SYSTEM_PROMPT_MATRIX</label>
            <textarea id="systemPromptInput" rows="5" placeholder="Define AI behavior parameters..."></textarea>
          </div>

          <div class="form-group">
            <label>TRIGGER_PREFIX</label>
            <input type="text" id="aiTriggerInput" placeholder="e.g. !ai">
          </div>

          <button class="btn-save" onclick="saveAiSettings()">UPDATE_SYSTEM_CONFIG</button>
        </div>
      </div>

    </div>

  </div>

  <script>
    const socket = io();
    let chats = {}; 
    let activeJid = null;
    let autoReplyEnabled = true;
    let ppCache = {}; // { jid: url }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    socket.on('status', (status) => {
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      if (status === 'open') {
        statusDot.className = 'dot online';
        statusText.innerText = 'ONLINE';
        statusText.style.color = 'var(--neon-green)';
      } else {
        statusDot.className = 'dot';
        statusText.innerText = 'OFFLINE';
        statusText.style.color = 'var(--neon-magenta)';
      }
    });

    socket.on('load_history', (messages) => {
      chats = {};
      if (Array.isArray(messages)) {
        messages.forEach(msg => appendMessageToLocal(msg));
      }
      renderChatList();
      updateDashboardStats();
    });

    socket.on('new_message', (data) => {
      if (!data) return;
      if (data.profilePictureUrl && data.from) ppCache[data.from] = data.profilePictureUrl;
      appendMessageToLocal(data);
      renderChatList();
      updateDashboardStats();
      if (activeJid === data.from) renderMessages(data.from);
    });

    socket.on('profile_picture', (data) => {
      if (!data || !data.jid || !data.url) return;
      ppCache[data.jid] = data.url;
      renderChatList();
      if (activeJid === data.jid) setRoomPP(data.jid);
    });

    socket.on('pp_cache', (data) => {
      if (!data) return;
      ppCache = { ...ppCache, ...data };
      renderChatList();
      if (activeJid) setRoomPP(activeJid);
    });

    socket.on('name_cache', (data) => {
      if (!data) return;
      for (const [jid, name] of Object.entries(data)) {
        if (chats[jid] && name && name.trim()) {
          const isOnlyNumber = /^\+?\d+$/.test(chats[jid].name);
          if (isOnlyNumber) chats[jid].name = name.trim();
        }
      }
      renderChatList();
      if (activeJid && data[activeJid]) {
        document.getElementById('roomTitle').innerText = data[activeJid];
      }
    });

    function setRoomPP(jid) {
      const box = document.getElementById('roomAvatar');
      const url = ppCache[jid];
      if (!url || !box) return;
      let img = box.querySelector('img');
      if (!img) {
        img = document.createElement('img');
        box.prepend(img);
      }
      img.src = url;
      img.onload = () => img.classList.add('loaded');
    }

    function appendMessageToLocal(msg) {
      const jid = msg.from;
      if (!jid) return;
      if (!chats[jid]) {
        chats[jid] = { name: msg.pushName || jid.replace(/@s\.whatsapp\.net|@g\.us/g, ''), isGroup: jid.endsWith('@g.us'), messages: [] };
      } else if (msg.pushName && msg.pushName.trim()) {
        // Update nama jika sebelumnya cuma nomor mentah
        const isOnlyNumber = /^\+?\d+$/.test(chats[jid].name);
        if (isOnlyNumber) chats[jid].name = msg.pushName.trim();
      }
      chats[jid].messages.push(msg);
      chats[jid].messages.sort((a, b) => Number(a.timestamp) - Number(b.timestamp));
    }

    function getTickIcon(status) {
      if (status === 3 || status === 'read') {
        return `<i class="fa-solid fa-check-double tick tick-blue"></i>`;
      } else if (status === 2 || status === 'delivered') {
        return `<i class="fa-solid fa-check-double tick tick-grey"></i>`;
      } else {
        return `<i class="fa-solid fa-check tick tick-grey"></i>`;
      }
    }

    function renderChatList() {
      const chatListEl = document.getElementById('chatList');
      const sortedJids = Object.keys(chats).sort((a, b) => {
        const lastA = chats[a].messages[chats[a].messages.length - 1]?.timestamp || 0;
        const lastB = chats[b].messages[chats[b].messages.length - 1]?.timestamp || 0;
        return Number(lastB) - Number(lastA);
      });

      if (sortedJids.length === 0) return;

      chatListEl.innerHTML = '';

      sortedJids.forEach(jid => {
        const chat = chats[jid];
        const lastMsg = chat.messages[chat.messages.length - 1];
        const tickHtml = lastMsg && lastMsg.isMe ? getTickIcon(lastMsg.status || 3) : '';

        const item = document.createElement('div');
        item.className = 'chat-card';
        item.onclick = () => openRoomOverlay(jid);

        item.innerHTML = `
          <div class="avatar-box" data-jid="${jid}">
            <i class="fa-solid ${chat.isGroup ? 'fa-users' : 'fa-user'}"></i>
            ${ppCache[jid] ? `<img src="${ppCache[jid]}" onload="this.classList.add('loaded')" onerror="">` : ''}
          </div>
          <div class="chat-info">
            <div class="chat-header-line">
              <span class="contact-title">${chat.name}</span>
              <span class="timestamp">${lastMsg ? new Date(Number(lastMsg.timestamp)).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : ''}</span>
            </div>
            <div class="preview-msg">${tickHtml} <span>${lastMsg ? lastMsg.text : ''}</span></div>
          </div>
        `;
        chatListEl.appendChild(item);
      });
    }

    function openRoomOverlay(jid) {
      activeJid = jid;
      document.getElementById('roomTitle').innerText = chats[jid] ? chats[jid].name : jid;
      setRoomPP(jid);
      renderMessages(jid);
      document.getElementById('roomOverlay').classList.add('active');
    }

    function closeRoomOverlay() {
      activeJid = null;
      document.getElementById('roomOverlay').classList.remove('active');
    }

    function renderMessages(jid) {
      const chatViewport = document.getElementById('chatViewport');
      chatViewport.innerHTML = '';
      const list = chats[jid] ? chats[jid].messages : [];

      list.forEach(msg => {
        const bubble = document.createElement('div');
        bubble.className = `msg-bubble ${msg.isMe ? 'sent' : 'received'}`;
        
        const timeStr = new Date(Number(msg.timestamp || Date.now())).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        const tickHtml = msg.isMe ? getTickIcon(msg.status || 3) : '';

        bubble.innerHTML = `
          ${msg.text}
          <div class="msg-meta">
            <span>${timeStr}</span>
            ${tickHtml}
          </div>
        `;
        chatViewport.appendChild(bubble);
      });
      chatViewport.scrollTop = chatViewport.scrollHeight;
    }

    function sendMessage() {
      const msgInput = document.getElementById('msgInput');
      const text = msgInput.value.trim();
      if (!text || !activeJid) return;

      socket.emit('send_message', { to: activeJid, message: text }, (res) => {
        if (res && res.success) msgInput.value = '';
      });
    }

    function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

    function handleNewChat(e) {
      if (e.key === 'Enter') {
        let phone = e.target.value.replace(/[^0-9]/g, '');
        if (!phone) return;
        const jid = `${phone}@s.whatsapp.net`;
        if (!chats[jid]) chats[jid] = { name: `+${phone}`, isGroup: false, messages: [] };
        e.target.value = '';
        openRoomOverlay(jid);
      }
    }

    function toggleAutoReply() {
      const checkbox = document.getElementById('autoReplyToggle');
      autoReplyEnabled = checkbox.checked;
      
      const el = document.getElementById('autoReplyStatusText');
      el.innerText = autoReplyEnabled ? 'ACTIVE' : 'DISABLED';
      el.style.color = autoReplyEnabled ? 'var(--neon-cyan)' : 'var(--neon-magenta)';

      socket.emit('toggle_autoreply', { enabled: autoReplyEnabled });
    }

    function updateDashboardStats() {
      let totalIncoming = 0;
      let totalReplied = 0;
      Object.values(chats).forEach(chat => {
        if (Array.isArray(chat.messages)) {
          chat.messages.forEach(msg => {
            if (!msg.isMe) totalIncoming++;
            else totalReplied++;
          });
        }
      });
      document.getElementById('statIncoming').innerText = totalIncoming;
      document.getElementById('statReplied').innerText = totalReplied;
    }

    function saveAiSettings() {
      const key = document.getElementById('apiKeyInput').value;
      const prompt = document.getElementById('systemPromptInput').value;
      const trigger = document.getElementById('aiTriggerInput').value;
      
      socket.emit('save_ai_config', { apiKey: key, prompt: prompt, trigger: trigger }, (res) => {
        alert('SYSTEM_CONFIG_UPDATED');
      });
    }
  </script>
</body>
</html>
